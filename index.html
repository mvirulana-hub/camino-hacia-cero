<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camino hacia CERO · Paro, pienso y actúo</title><style>
:root{color-scheme:dark;--bg:#071b26;--card:#102e3d;--ink:#f2f7f6;--muted:#a9c5ce;--gold:#ffd36a;--mint:#74e3bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#174b58,transparent 60%),var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif;min-height:100vh}header{max-width:1120px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #ffffff20}.brand{font-size:12px;font-weight:800;letter-spacing:2px}.tag{font-size:12px;border:1px solid #74e3bb60;padding:5px 12px;border-radius:30px;color:var(--mint)}main{max-width:1120px;margin:auto;padding:32px 24px 60px}h1{font-size:clamp(40px,7vw,80px);line-height:1.02;letter-spacing:-3px;margin:18px 0}h1 em{color:var(--gold);font-style:normal}h2{font-size:clamp(25px,4vw,36px);line-height:1.15;margin:14px 0}p{max-width:680px}.muted{color:var(--muted)}.eyebrow{color:var(--mint);font-size:12px;letter-spacing:2px;font-weight:800}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:38px;align-items:center}.panel{border:1px solid #ffffff20;background:linear-gradient(135deg,#173d4d,#102a38);border-radius:24px;padding:26px;box-shadow:0 20px 60px #0003}.primary,button{cursor:pointer;font:inherit;border-radius:12px;padding:14px 20px;border:1px solid #ffffff35;background:#183c4c;color:var(--ink);text-align:left;transition:transform .15s,background .15s}button:hover{background:#245165;transform:translateY(-2px)}button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.primary{background:var(--gold);color:#102b37;font-weight:800;border-color:var(--gold)}.primary:hover{background:#ffe5a6}button:disabled{cursor:default;transform:none;opacity:.85}.ghost{background:transparent;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.stats{display:flex;gap:28px;margin:25px 0}.stats strong{display:block;color:var(--gold);font-size:26px}.stats small{color:var(--muted)}.route{width:100%;height:auto;max-height:460px}.trail{stroke-dasharray:12 8;animation:flow 18s linear infinite}@keyframes flow{to{stroke-dashoffset:-200}}.map-label{font:700 11px system-ui;fill:#f2f7f6}.hud{display:flex;justify-content:space-between;gap:15px;font-size:14px;color:var(--muted);margin-bottom:14px}.bar{height:7px;border-radius:20px;background:#ffffff15;overflow:hidden;margin-bottom:28px}.bar span{display:block;height:100%;background:var(--mint);transition:width .4s}.scene{font-size:62px;display:flex;align-items:center;justify-content:center;gap:18px;min-height:135px;border-radius:18px;background:linear-gradient(135deg,#081e2a,#1a4655);position:relative;overflow:hidden;margin:18px 0}.scene:after{content:'';position:absolute;bottom:0;height:15px;width:100%;background:repeating-linear-gradient(120deg,#ffd36a 0 15px,#233f48 15px 30px)}.options{display:grid;gap:12px;margin-top:22px}.option{display:flex;gap:14px;align-items:flex-start;width:100%}.letter{border:1px solid #ffffff40;min-width:28px;height:28px;border-radius:8px;text-align:center;font-size:14px;line-height:26px}.correct{border-color:var(--mint);background:#174c43!important}.wrong{border-color:#ffa08a;background:#553a39!important}.feedback{padding:18px;border-radius:14px;margin-top:18px;border:1px solid var(--mint);background:#0b3c36}.feedback.retry{border-color:#ffbe8b;background:#483b2c}.feedback strong{display:block;margin-bottom:5px}footer{font-size:12px;color:var(--muted);margin-top:36px;max-width:850px}.badge{display:inline-block;border:1px solid #ffd36a55;background:#ffd36a10;color:var(--gold);padding:10px 16px;border-radius:30px;margin:6px}.big{font-size:70px;color:var(--gold);font-weight:900}.hidden{display:none!important}.lesson{border-left:3px solid var(--mint);padding-left:15px;margin:20px 0}.confetti{position:fixed;pointer-events:none;inset:0;overflow:hidden}.confetti i{position:absolute;top:-30px;animation:fall 2.8s ease-in forwards;font-style:normal}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:0}}@media(max-width:720px){.grid{grid-template-columns:1fr;gap:24px}main{padding:24px 17px 40px}.panel{padding:20px}header{padding:18px}.route{max-height:320px}.stats{gap:22px}h1{letter-spacing:-2px}.tag{font-size:10px}.option{font-size:16px}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}@media print{header,.actions,footer{display:none}body{background:white;color:black}.panel{background:white;border:1px solid #aaa}.muted{color:#444}}
</style></head><body><header><div class="brand">THINK SAFE. ACT SAFE.</div><div class="tag">CAMPAÑA DE SEGURIDAD · GARÍN</div></header><main id="app"></main><div id="celebrate" class="confetti" aria-hidden="true"></div>
<script>
const missions=[
{zone:0,title:'El atasco inesperado',scene:'⚙️ 🧶 ⚠️',text:'Estás realizando tu tarea habitual. El material empieza a trabarse y el equipo ya no funciona como esperabas. ¿Qué hacés primero?',options:['Intento liberar el material de la manera que me resulte más rápida.','Hago una pausa y consulto si el método previsto sigue siendo aplicable.','Sigo trabajando: conozco bien esta máquina.'],answer:1,why:'El atasco cambió las condiciones. Antes de intervenir, hay que reevaluar y pedir apoyo según el procedimiento local. Conocer la tarea no elimina el nuevo riesgo.',take:'Una tarea conocida puede convertirse en una situación no rutinaria.'},
{zone:0,title:'El camino cambió',scene:'🚶 📦 🚧',text:'La ruta habitual está bloqueada por materiales. Un compañero propone pasar por una zona de circulación de vehículos. ¿Qué cambió?',options:['Solo cambió la distancia; el riesgo es el mismo.','Nada importante, porque el bloqueo es temporal.','Cambió el recorrido y pueden aparecer nuevas interacciones con vehículos.'],answer:2,why:'Una ruta temporal puede generar exposición a vehículos. Consultá el recorrido seguro autorizado; no improvises un desvío.',take:'Los cambios del entorno también cambian la tarea.'},
{zone:0,title:'Del robot a las manos',scene:'🤖 📦 ✋',text:'Una parte del sistema automático se detiene. Se propone manipular cajas manualmente mientras otra cinta continúa funcionando. ¿Qué debemos reconocer?',options:['Pueden aparecer nuevos puntos de atrapamiento y otras exposiciones.','Manipular cajas es habitual, así que no cambia el riesgo.','Lo único diferente será la velocidad de producción.'],answer:0,why:'La interacción manual con un sistema parcialmente detenido puede introducir peligros nuevos. El equipo debe revisar las condiciones y los controles antes de empezar.',take:'La misma caja, en otras condiciones, puede implicar otros riesgos.'},
{zone:1,title:'“Siempre estuvo ahí”',scene:'📦 🚶 📦',text:'Unos materiales llevan semanas reduciendo el espacio de circulación. Todos aprendieron a esquivarlos. ¿Qué está pasando?',options:['El equipo encontró una solución definitiva.','Nos acostumbramos a una condición que necesita revisión.','La experiencia ya compensó el riesgo.'],answer:1,why:'La familiaridad puede hacer que dejemos de ver un riesgo. La condición merece ser comunicada y revisada aunque todavía no haya ocurrido una lesión.',take:'Acostumbrarse no equivale a controlar.'},
{zone:1,title:'La solución provisoria',scene:'🛠️ 📋 🔄',text:'La herramienta prevista no está disponible. Hace días que se utiliza otra para resolver la tarea. ¿Qué pregunta ayuda a comprender la situación?',options:['¿Quién logra terminar más rápido con la herramienta alternativa?','¿Cuántos días podemos seguir sin avisar?','¿Por qué falta la herramienta adecuada y qué necesitamos para recuperar el método seguro?'],answer:2,why:'Comprender la dificultad permite trabajar sobre el problema. Una solución repetida no se vuelve adecuada por el paso del tiempo.',take:'Revisemos qué nos lleva a improvisar.'},
{zone:1,title:'“Nunca pasó nada”',scene:'💬 ⚠️ 🔍',text:'Al conversar sobre una condición insegura, alguien dice: “Hace años que lo hacemos así y nunca pasó nada”. ¿Cuál es la mejor respuesta?',options:['Que no haya habido una lesión no demuestra que el riesgo esté controlado. Revisémoslo juntos.','Entonces podemos considerarlo seguro.','Solo lo revisamos si ocurre un accidente.'],answer:0,why:'La ausencia de lesiones no reemplaza la evaluación del riesgo. Una conversación respetuosa ayuda a revisar condiciones que se aceptaron como normales.',take:'La experiencia sirve para anticipar, no para descartar señales.'},
{zone:2,title:'Dos trabajos, una zona',scene:'👷 🔧 🏗️',text:'Tu equipo debe realizar una reparación donde otro grupo está trabajando por encima. ¿Cómo actuamos?',options:['Empezamos y coordinamos si aparece un problema.','Pausamos el inicio y coordinamos los trabajos y controles con los responsables.','Nos mantenemos atentos y trabajamos rápido.'],answer:1,why:'Las actividades simultáneas pueden exponer a personas a caída de materiales. Antes de comenzar, los responsables deben coordinar los controles aplicables.',take:'Anticipar la interacción entre trabajos también es actuar.'},
{zone:2,title:'Tu aviso cuenta',scene:'👀 ⚠️ 📣',text:'Detectás una condición que puede causar una lesión grave y que no podés corregir dentro de tu función. ¿Qué hacés?',options:['Espero al final del turno para comentarlo.','La corrijo por mi cuenta aunque no esté autorizado.','Utilizo el proceso local de detención o alerta y solicito apoyo sin exponerme.'],answer:2,why:'Actuar incluye pedir ayuda y utilizar el proceso local cuando existe un riesgo grave. Corregir no significa intervenir fuera de tu capacitación o autorización.',take:'Pedir apoyo es una decisión de seguridad.'},
{zone:2,title:'El círculo se cierra',scene:'📣 📋 ✅',text:'Una persona reportó una condición. La solución definitiva requiere tiempo. ¿Qué debe hacer el liderazgo?',options:['Dar seguimiento, gestionar los controles necesarios e informar el estado y el próximo paso.','Guardar el aviso hasta poder resolverlo por completo.','Marcarlo como cerrado porque ya tiene responsable.'],answer:0,why:'Las inquietudes necesitan respuesta. Asignar un responsable no equivale a resolver; hay que seguir la acción y mantener informada a la persona.',take:'Escuchar, responder y dar seguimiento construye confianza.'},
{zone:3,title:'Misión final · La decisión que cambia todo',scene:'⚙️ 👥 🛡️',text:'El equipo se detuvo de manera inesperada. Se propone un método manual que no está contemplado en la instrucción habitual y alguien dice: “Ya lo hicimos antes”. ¿Qué decisión reúne los tres hábitos?',options:['Continuar con cuidado, porque ya existe experiencia.','Reconocer el cambio, revisar los nuevos riesgos con el equipo y acordar los controles y autorizaciones necesarios antes de continuar.','Pedir al compañero con más experiencia que improvise un método.'],answer:1,why:'Reconocer → comprender → actuar. Si la tarea real ya no coincide con lo previsto, corresponde pausar, reevaluar y obtener apoyo. La respuesta y el análisis deben ajustarse al riesgo y a los procedimientos locales.',take:'Paro. Pienso. Actúo. Cada decisión cuenta.'}
];
const zones=['RECONOCER','COMPRENDER','ACTUAR','MISIÓN FINAL'];let current=0,first=0,attempts=0,review=[];const app=document.getElementById('app');
function map(){return `<svg class="route" viewBox="0 0 420 400" role="img" aria-label="Un camino amarillo une las zonas Reconocer, Comprender y Actuar con la meta Cero"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#ffd36a"/><stop offset="1" stop-color="#ffae58"/></linearGradient></defs><circle cx="210" cy="180" r="154" fill="#173f4d"/><path d="M95 340 C20 260 220 300 185 223 S60 176 110 117 S290 150 320 55" fill="none" stroke="#081f2b" stroke-width="36"/><path class="trail" d="M95 340 C20 260 220 300 185 223 S60 176 110 117 S290 150 320 55" fill="none" stroke="url(#g)" stroke-width="23"/>${[[95,340,'01 · RECONOCER'],[185,223,'02 · COMPRENDER'],[110,117,'03 · ACTUAR'],[320,55,'CERO']].map(([x,y,t],i)=>`<circle cx="${x}" cy="${y}" r="23" fill="${i===3?'#74e3bb':'#ffd36a'}" stroke="#123747" stroke-width="5"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#103241" font-family="system-ui" font-weight="900">${i===3?'★':i+1}</text><text class="map-label" x="${x+30}" y="${y+5}">${t}</text>`).join('')}<text x="275" y="290" font-size="68">🛡️</text></svg>`}
function home(){app.innerHTML=`<div class="grid"><section><div class="eyebrow">TU PRÓXIMA DECISIÓN CUENTA</div><h1>Camino<br>hacia <em>CERO.</em></h1><p class="muted">Algo cambió en la planta. ¿Podés reconocerlo antes de seguir? Recorré tres zonas y convertí cada decisión en una oportunidad para cuidarnos.</p><div class="stats"><div><strong>3</strong><small>zonas</small></div><div><strong>10</strong><small>desafíos</small></div><div><strong>∞</strong><small>tiempo para pensar</small></div></div><button class="primary" onclick="start()">Comenzar la aventura →</button><p class="muted" style="font-size:14px">5–8 minutos · Sin registro · Para jugar solo o en equipo</p></section><div class="panel">${map()}<div style="text-align:center;font-weight:800;color:var(--gold)">PARO · PIENSO · ACTÚO</div></div></div><footer>Adaptación educativa local de Think Safe. Act Safe. Los ejemplos no reemplazan los procedimientos, permisos, análisis de riesgos ni la capacitación del sitio. El resultado se muestra en este dispositivo; no se envían datos ni se guarda un ranking.</footer>`}
function start(){current=0;first=0;review=[];show()}
function show(){attempts=0;const q=missions[current];app.innerHTML=`<div class="hud"><span>${zones[q.zone]}</span><span>Desafío ${current+1} de ${missions.length}</span></div><div class="bar"><span style="width:${current/missions.length*100}%"></span></div><div class="grid" style="align-items:start"><section><div class="eyebrow">${q.zone===3?'INTEGRÁ LOS TRES HÁBITOS':'ZONA '+(q.zone+1)+' / 3'}</div><h2 id="title" tabindex="-1">${q.title}</h2><div class="scene" aria-hidden="true">${q.scene}</div><p>${q.text}</p><p class="muted" style="font-size:14px">Elegí una respuesta. Podés pensar todo lo que necesites.</p></section><section class="panel"><div class="eyebrow">TU DECISIÓN</div><div class="options">${q.options.map((o,i)=>`<button class="option" id="o${i}" onclick="choose(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><button id="next" class="primary hidden" style="margin-top:20px;width:100%" onclick="next()">${current===9?'Ver mi resultado':'Seguir el camino'} →</button></section></div><footer>Ante dudas, pedí apoyo al responsable del sector o a EHS. Usá siempre los procesos locales de alerta y detención del trabajo.</footer>`;document.getElementById('title').focus()}
function choose(i){const q=missions[current],button=document.getElementById('o'+i);if(button.disabled)return;attempts++;if(i!==q.answer){button.classList.add('wrong');button.disabled=true;document.getElementById('feedback').innerHTML='<div class="feedback retry"><strong>Hagamos una pausa.</strong>Esa opción deja una exposición sin resolver. Buscá la respuesta que reconoce el cambio, evita improvisar o pide el apoyo adecuado. Podés volver a elegir.</div>';return}if(attempts===1)first++;else review.push(q.title);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>✓ Una decisión que nos cuida</strong>${q.why}<div class="lesson">${q.take}</div></div>`;document.getElementById('next').classList.remove('hidden')}
function next(){current++;if(current===missions.length)finish();else show()}
function finish(){app.innerHTML=`<div style="max-width:760px;margin:auto;text-align:center"><div class="eyebrow">RECORRIDO COMPLETADO</div><div style="font-size:72px;margin-top:20px">🏆</div><h1 style="font-size:clamp(38px,6vw,60px)">Cada decisión<br><em>nos acerca a CERO.</em></h1><p style="margin:20px auto" class="muted">Completaste los diez desafíos y revisaste todas las decisiones seguras.</p><div class="panel"><div class="big">${first} / 10</div><div>respuestas correctas en el primer intento</div><p class="muted" style="margin:12px auto;font-size:14px">Aprender también es detenerse y volver a pensar.</p><div><span class="badge">🔍 Reconocer</span><span class="badge">💡 Comprender</span><span class="badge">🛡️ Actuar</span></div></div>${review.length?`<div class="panel" style="text-align:left;margin-top:20px"><strong>Para volver a conversar con tu equipo</strong><ul>${review.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}<div class="lesson" style="text-align:left"><strong>Tu misión en planta</strong><p>Identificá un cambio en tu trabajo y conversá con tu equipo: ¿qué cambió, qué riesgo aparece y qué necesitamos antes de continuar?</p></div><div class="actions" style="justify-content:center"><button class="primary" onclick="start()">Volver a jugar ↻</button><button class="ghost" onclick="window.print()">Imprimir resultado</button><button class="ghost" onclick="home()">Inicio</button></div><footer style="text-align:left">Resultado educativo individual. No constituye una habilitación ni una evaluación oficial de la campaña. Juego basado en los materiales de Think Safe. Act Safe.; las situaciones de comprender y actuar son adaptaciones locales.</footer></div>`;if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const box=document.getElementById('celebrate');box.innerHTML=Array.from({length:35},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.8}s;color:${i%2?'#ffd36a':'#74e3bb'}">✦</i>`).join('');setTimeout(()=>box.innerHTML='',4000)}}home();
</script></body></html>
